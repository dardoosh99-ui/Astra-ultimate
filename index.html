<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASTRA Ultimate</title><style>
*{box-sizing:border-box}body{margin:0;background:#09152a;color:#eaf8ff;font:15px system-ui;overflow:hidden}canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;pointer-events:none}#hud>div{background:#0a193cdd;border:1px solid #78b7d966;border-radius:14px;padding:10px}strong{color:#85efff}small{display:block;color:#c2d6e9}#msg{position:absolute;top:95px;left:50%;transform:translateX(-50%);background:#132e58ec;border-radius:12px;padding:10px;text-align:center;width:max-content;max-width:85vw}button{touch-action:none;border:1px solid #82d4ff88;border-radius:14px;background:#173d72dd;color:white;font-size:23px}#move{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:15px;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:5px}#scan{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));height:65px;padding:0 14px;font-size:16px}#night{position:absolute;right:15px;top:104px;font-size:14px;padding:10px}
</style></head><body><div id="hud"><div><strong>✦ ASTRA ULTIMATE</strong><small>Nexus Valley · Monde 3D</small></div><div><strong id="score">💎 0/12</strong><small>Collecte les cristaux</small></div></div><div id="msg">Explore Nexus Valley !</div><button id="night">☀️ Jour / Nuit</button><div id="move"><span></span><button data-m="up">▲</button><span></span><button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button></div><button id="scan">🔎 Scanner</button>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x91c6e6);scene.fog=new T.Fog(0x91c6e6,25,75);
const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,120),r=new T.WebGLRenderer({antialias:true,powerPreference:'low-power'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.7));document.body.prepend(r.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x41664c,2));const sun=new T.DirectionalLight(0xffe2aa,2);sun.position.set(10,20,8);scene.add(sun);
const mat=c=>new T.MeshStandardMaterial({color:c}),make=(g,m,x,y,z)=>{const a=new T.Mesh(g,m);a.position.set(x,y,z);scene.add(a);return a};
const ground=make(new T.PlaneGeometry(100,100),mat(0x47876c),0,0,0);ground.rotation.x=-Math.PI/2;const road=make(new T.PlaneGeometry(5,80),mat(0xbca884),0,.02,0);road.rotation.x=-Math.PI/2;
for(let i=0;i<80;i++){let x=Math.sin(i*12.3)*36,z=Math.cos(i*9.7)*36;if(Math.abs(x)<4)continue;make(new T.CylinderGeometry(.16,.24,1.8,6),mat(0x70503b),x,.9,z);make(new T.ConeGeometry(1.1,2.6,7),mat(0x26765a),x,2.8,z)}
const hero=new T.Group(),body=new T.Mesh(new T.CapsuleGeometry(.35,.75,5,9),mat(0x5de1ff));body.position.y=.95;hero.add(body);scene.add(hero);
const locations=[[-2,-6],[2,-12],[-1,-18],[2,-24],[-2,8],[2,15],[-1,23],[2,30],[-8,-15],[9,7],[-9,23],[9,-29]];
let saved=[];try{saved=JSON.parse(localStorage.getItem('astra-crystals')||'[]')}catch{}const found=new Set(saved),crystals=locations.map(([x,z],i)=>{let m=make(new T.OctahedronGeometry(.55),new T.MeshStandardMaterial({color:i%2?0xa57aff:0x65fff0,emissive:i%2?0x48218b:0x09646a,emissiveIntensity:.7}),x,.9,z);m.visible=!found.has(i);return m});
const monuments=[{x:-8,z:-8,name:'Observatoire'},{x:9,z:-20,name:'Portail ancien'},{x:-9,z:19,name:'Tour des étoiles'}];monuments.forEach((p,i)=>{make(new T.CylinderGeometry(.8,1.2,3+i,6),mat(0x8a87ad),p.x,1.5+i/2,p.z);make(new T.OctahedronGeometry(.75),mat(0xffd76c),p.x,3.4+i,p.z)});
const score=document.querySelector('#score'),msg=document.querySelector('#msg');function update(){score.textContent='💎 '+found.size+'/12'}update();let until=0;function notice(t){msg.textContent=t;msg.hidden=false;until=performance.now()+3000}
const pressed=new Set();document.querySelectorAll('[data-m]').forEach(b=>{let k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.add(k)};for(let name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>pressed.delete(k))});
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};onkeydown=e=>{if(keys[e.key]){pressed.add(keys[e.key]);e.preventDefault()}};onkeyup=e=>pressed.delete(keys[e.key]);
document.querySelector('#scan').onclick=()=>{let p=monuments.map(m=>({...m,d:Math.hypot(m.x-hero.position.x,m.z-hero.position.z)})).sort((a,b)=>a.d-b.d)[0];notice(p.d<5?'📡 '+p.name+' découvert !':'Approche-toi d’un monument.')};
let night=false;document.querySelector('#night').onclick=()=>{night=!night;scene.background.setHex(night?0x08162d:0x91c6e6);scene.fog.color.copy(scene.background);sun.intensity=night?.3:2;notice(night?'🌙 Mode nuit':'☀️ Mode jour')};
let last=performance.now();function frame(t){requestAnimationFrame(frame);let dt=Math.min((t-last)/1000,.05);last=t;let x=Number(pressed.has('right'))-Number(pressed.has('left')),z=Number(pressed.has('down'))-Number(pressed.has('up')),d=Math.hypot(x,z)||1;hero.position.x=T.MathUtils.clamp(hero.position.x+x/d*6*dt,-38,38);hero.position.z=T.MathUtils.clamp(hero.position.z+z/d*6*dt,-38,38);if(x||z)hero.rotation.y=Math.atan2(-x,-z);crystals.forEach((c,i)=>{if(!c.visible)return;c.rotation.y+=dt;c.position.y=.9+Math.sin(t*.002+i)*.15;if(Math.hypot(hero.position.x-c.position.x,hero.position.z-c.position.z)<1.2){c.visible=false;found.add(i);localStorage.setItem('astra-crystals',JSON.stringify([...found]));update();notice(found.size===12?'🏆 Mission accomplie !':'✨ Cristal récupéré !')}});cam.position.lerp(new T.Vector3(hero.position.x+7,9,hero.position.z+12),.07);cam.lookAt(hero.position.x,1,hero.position.z-2);r.render(scene,cam);if(t>until)msg.hidden=true}requestAnimationFrame(frame);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
</script></body></html>
